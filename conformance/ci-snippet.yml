h1spec:
  runs-on: ubuntu-latest
  strategy:
    fail-fast: false
    matrix:
      runtime: [eio, lwt]
  steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: uNetworking/h1spec
        ref: f0a5650a20c575fbea0f7179a3a9cfa50f20ba6e
        path: _h1spec
    - uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: "5.3"
    - uses: denoland/setup-deno@v2
      with:
        deno-version: v2.1.x
    - run: opam install . --deps-only --with-test --yes
    - run: opam exec -- sh conformance/run.sh "h1spec-${{ matrix.runtime }}.txt"
      env:
        RUNTIME: ${{ matrix.runtime }}
        H1SPEC: ${{ github.workspace }}/_h1spec/http_test.ts
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: h1spec-${{ matrix.runtime }}
        path: h1spec-${{ matrix.runtime }}.txt
